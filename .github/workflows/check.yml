name: Verify website
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js && node --check audio.js && node --check database.js && node --check competition.js && node --check organizer.js && node --check config.js && node --check standings.js && node --check theme.js
      - run: node verify.cjs
      - run: node verify-auth.cjs
      - run: npm install --prefix output/testdeps --no-save --package-lock=false --ignore-scripts @electric-sql/pglite@0.3.14
      - run: node verify-database.cjs output/testdeps/node_modules/@electric-sql/pglite/dist/index.cjs
      - run: node build.cjs
